<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Mastery Hub</title>
    <meta name="description" content="An interactive web application to help users learn Chinese vocabulary for HSK (Hanyu Shuiping Kaoshi) tests. Users can browse vocabulary by HSK level, view detailed information about each word including pinyin, meaning, grammar, and example sentences.">
    <meta property="og:title" content="HSK Mastery Hub">
    <meta property="og:description" content="An interactive web application to help users learn Chinese vocabulary for HSK (Hanyu Shuiping Kaoshi) tests. Users can browse vocabulary by HSK level, view detailed information about each word including pinyin, meaning, grammar, and example sentences.">
    <meta name="keywords" content="HSK, Chinese, Mandarin, language learning, study plan, vocabulary, practice">
    <meta name="theme-color" content="#4a90e2">
    <script>
      (function () {
        function isExtensionError(msg, stack) {
          var text = (msg || '') + ' ' + (stack || '');
          return (
            text.indexOf('MetaMask') !== -1 ||
            text.indexOf('chrome-extension://') !== -1 ||
            text.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            if (
              isExtensionError(
                event.message,
                (event.filename || '') + ' ' + (event.error && event.error.stack ? event.error.stack : '')
              )
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var msg = reason && reason.message ? reason.message : String(reason || '');
            var stack = reason && reason.stack ? reason.stack : '';
            if (isExtensionError(msg, stack)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Basic scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #555; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #777; }
        .font-noto-sc { font-family: 'Noto Sans SC', sans-serif; }

        /* Flashcard flip animation */
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 1.5rem;
            border-radius: 1rem; /* Corresponds to rounded-xl */
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* Card slide out animations */
        .card-exit-correct {
            animation: slideOutRight 0.5s forwards ease-in-out;
        }
        .card-exit-incorrect {
            animation: slideOutLeft 0.5s forwards ease-in-out;
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0) rotate(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%) rotate(10deg);
            }
        }

        @keyframes slideOutLeft {
            from {
                opacity: 1;
                transform: translateX(0) rotate(0);
            }
            to {
                opacity: 0;
                transform: translateX(-100%) rotate(-10deg);
            }
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
